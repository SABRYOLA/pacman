# DQN Configuration for Ms. Pac-Man

# Environment
env_name: "ALE/MsPacman-v5"
render_mode: null

# Training
total_timesteps: 1000000
learning_rate: 0.0001
batch_size: 32
buffer_size: 100000
learning_starts: 50000
target_update_interval: 1000
train_freq: 4
gradient_steps: 1

# Exploration
exploration_fraction: 0.1
exploration_initial_eps: 1.0
exploration_final_eps: 0.01

# RL Parameters
gamma: 0.99
tau: 1.0

# Logging
log_interval: 1000
eval_freq: 10000
eval_episodes: 10
save_freq: 50000

# Device
device: "auto"  # "auto", "cuda", or "cpu"

# Seed
seed: 42
