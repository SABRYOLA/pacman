# PPO Configuration for Ms. Pac-Man

# Environment
env_name: "ALE/MsPacman-v5"
render_mode: null
n_envs: 8  # Number of parallel environments

# Training
total_timesteps: 1000000
learning_rate: 0.00025
n_steps: 128  # Steps per environment per update
batch_size: 256
n_epochs: 4

# PPO Parameters
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
normalize_advantage: true
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Logging
log_interval: 1
eval_freq: 10000
eval_episodes: 10
save_freq: 50000

# Device
device: "auto"  # "auto", "cuda", or "cpu"

# Seed
seed: 42
